name: Lighthouse CI
on:
  push: { branches: [main] }
  pull_request:
  # Manual calibration runs (arch-L13): re-measure lighthouserc.json's
  # thresholds against this same 2-core runner without waiting on a push.
  # skip_e2e exists only for that lane — the e2e suite has its own, unrelated
  # pre-existing failure (a route-tree warning, not a CWV concern) and every
  # calibration dispatch pays its several minutes for zero extra signal about
  # Lighthouse numbers. push/pull_request runs always run both suites.
  workflow_dispatch:
    inputs:
      skip_e2e:
        description: "Skip the e2e step (calibration-only run)"
        type: boolean
        default: false
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lhci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # Installed once: both the e2e suite and lhci drive chromium.
      - run: npx playwright install --with-deps chromium
      - run: npm run build

      # The Playwright suite lives here rather than in ci.yml because it needs
      # a production build and a served origin, and this workflow already pays
      # for both. Running it in its own workflow would mean a second vite build
      # on every PR for no extra signal.
      - name: End-to-end tests
        # `inputs.*` (unlike `github.event.inputs.*`) is typed from the
        # workflow_dispatch input declaration above, so this compares
        # boolean to boolean -- confirmed by the round-1/round-2 arch-L13
        # calibration dispatches: comparing against the string 'true' here
        # instead made e2e run on every dispatch, the opposite of the point.
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_e2e != true }}
        run: npm run test:e2e

      - name: Lighthouse
        if: ${{ !cancelled() }}
        run: npx @lhci/cli autorun

      # Summarises whatever .lighthouseci/ this run just produced into the
      # generated data file /ops reads (scripts/gen-lighthouse-summary.mjs).
      # Runs even when the assertions above failed — a red run is exactly the
      # one whose numbers most need to reach the board.
      - name: Lighthouse summary
        if: ${{ !cancelled() }}
        run: node scripts/gen-lighthouse-summary.mjs

      - name: Upload Lighthouse summary
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: lighthouse-summary
          path: src/data/generated/lighthouse.ts
          retention-days: 14

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        # An artifact is a convenience; the account's 500 MB artifact quota must not fail the gate.
        continue-on-error: true
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
