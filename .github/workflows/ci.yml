name: CI

# The gate that did not exist. Until now the only workflows were Lighthouse,
# a nightly media refresh and a screenshot sentinel — so 668 unit tests, the
# Playwright suite and eslint never ran on a pull request at all, and nothing
# stopped a red commit reaching main.
#
# Deliberately does NOT run `npm run build` (the generator-refreshing,
# network-fetching prebuild chain plus tsc plus vite). lighthouse.yml already
# pays for that build on every PR, and a second full one here would be the
# same work paid twice, forever. vitest and eslint need neither a bundle nor a
# server; `tsc -b` type-checks without one; the e2e suite needs the full build
# and a server, so it stays in lighthouse.yml beside that build.
#
# It DOES run a bare `npx vite build` (client + server, no prebuild) so the
# bundle-budget gate below has a manifest to read. That's deliberately not the
# same build as `npm run build`'s: prebuild's job is refreshing generated
# content, and check:generated (below) already guarantees the committed
# generated files match their generators, so a plain `vite build` reads
# byte-identical inputs without this job also making 20+ live network calls.
# A regression here is caught in ~seconds instead of waiting on lighthouse.yml's
# slower playwright-install-and-e2e job.
on:
  push: { branches: [main] }
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci

      # One consolidated job, but every check still reports. `!cancelled()`
      # means a failing type-check does not hide a lint error and a lint error
      # does not hide eleven failing tests — one run tells you everything that
      # is wrong, which is what makes a single gate as informative as three.
      - name: Type-check
        run: npx tsc -b
      - name: Lint
        if: ${{ !cancelled() }}
        run: npm run lint
      - name: Unit tests
        if: ${{ !cancelled() }}
        run: npm run test

      # A committed generated artifact that disagrees with its generator compiles
      # perfectly right up until someone regenerates it. That is not theoretical
      # here: a stale CvChessData.kt broke the Compose twin with 159 errors while
      # both repos' CI was green. Deterministic generators only; the live-source
      # ones are policed by the dated stamps in freshnessSla.ts instead.
      - name: Generated artifacts match their generators
        if: ${{ !cancelled() }}
        run: npm run check:generated

      # A bare vite build, not `npm run build` — see the comment at the top
      # of this file for why the two are deliberately different here.
      - name: Build (client + server, no prebuild)
        if: ${{ !cancelled() }}
        run: npx vite build
      - name: Bundle budgets
        if: ${{ !cancelled() }}
        run: npm run check:budget
