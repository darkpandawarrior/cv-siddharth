name: Refresh the Compose twin

# Rebuilds cv-siddharth-kmp's Wasm distribution, syncs it into
# heavy/portfolio-app (the live demo /project/portfolio embeds), re-derives the
# twin's figures into repoStats.ts, regenerates the twin's build-manifest.json
# and its Kotlin data layer, and commits any drift.
#
# WHY THIS EXISTS. The embedded demo was a hand copy with no script behind it.
# On 2026-09-01 its .wasm files were dated 13 August: nineteen days and thirteen
# ported surfaces stale, so the page advertising the twin was booting a build
# with seven routes while the twin had twenty. Nothing in this repo could see it,
# because a stale binary serves perfectly and a hand-kept number reads fine.
#
# Same contract refresh-media.yml already uses for the app repos: pull daily,
# commit the drift, no manual poke.
on:
  schedule:
    - cron: '41 5 * * 1'   # weekly, Monday 05:41 UTC, before refresh-media; was daily until the 10 GB deployment cap
  # No longer triggered by refresh-media's completion (workflow_run): the
  # doctor (doctor.yml, SH-4) heals twin drift daily now, so this workflow
  # goes back to being purely its own weekly schedule.
  workflow_dispatch:
    inputs:
      dry_run:
        description: Do everything except push.
        type: boolean
        default: false
      fixture:
        description: Force a scenario for testing.
        type: choice
        options: [none, code-change, heartbeat]
        default: none

permissions:
  contents: write
  issues: write

concurrency:
  group: refresh-twin
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The twin is a separate PUBLIC repo, checked out as a sibling because
      # that is the layout scripts/sync-twin.mjs and gen-repo-stats.mjs both
      # assume (../cv-siddharth-kmp). Neither fails when it is absent, which is
      # what keeps a local build offline-safe.
      - uses: actions/checkout@v4
        with:
          repository: darkpandawarrior/cv-siddharth-kmp
          submodules: recursive
          path: cv-siddharth-kmp-checkout
      - name: Put the twin where the scripts expect it
        run: mv cv-siddharth-kmp-checkout ../cv-siddharth-kmp

      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - run: npm ci

      - name: Rebuild and sync the embedded demo
        run: node scripts/sync-twin.mjs

      # Re-derives kotlinLines, kotlinFiles and the four toolchain versions off
      # the twin's own tree. profile.ts interpolates them, so the page cannot
      # quote a version the build stopped using.
      - name: Re-derive the twin's figures
        run: npm run gen:repo-stats

      # Real repo/commit for the twin's own build-manifest.json (the other
      # four apps' manifests need their OWN sibling checked out beside this
      # repo, which only the maintainer's machine has — see gen-app-manifests.mjs).
      - name: Refresh app build manifests
        run: npm run gen:app-manifests

      # arch-L12: gen-kotlin-data.mjs had NO automated write-back path at all
      # (F4) — this is what actually runs it on the weekly cron. `if: always()`
      # and its own id, unconditional on anything committed above, because its
      # field-contract self-check (scripts/kotlin-field-contract.json) is a
      # correctness guard on THIS repo's own data, not a consequence of the
      # twin's build having changed — see "Gate result" below, which reads
      # this step's .outcome on its own, committed or not, and routes a
      # regression to "Open or update gate-failure issue" rather than pushing.
      # continue-on-error keeps that routing from also reddening the scheduled
      # job's own conclusion (the same fix as gate_tsc/gate_lint/gate_test/
      # gate_check_generated below).
      - name: Regenerate the twin's Kotlin data
        id: gate_kotlin
        if: always()
        continue-on-error: true
        run: npm run gen:kotlin

      # Same fixture contract as refresh-media.yml, for a consistent
      # workflow_dispatch surface; this workflow's own "Commit if changed"
      # below never stages src/world, so code-change is a no-op here on
      # purpose (there is nothing here for it to be a non-generator diff IN).
      - name: 'Fixture: code-change (force a non-generator diff)'
        if: inputs.fixture == 'code-change'
        run: |
          mkdir -p src/world/v2
          echo "// classify-diff dry-run fixture $(date -u +%FT%TZ)" >> src/world/v2/Water.tsx

      # Stage + commit LOCALLY regardless of what ran above — this costs
      # nothing even on a run that ends up pushing nothing, and it lets the
      # four gate steps below check exactly what would be pushed. Pushing is a
      # separate, later step gated on all four passing (see below): this used
      # to sit right next to an `if: always()` commit+push that ran even when
      # check:generated had just failed, which is the six-day drift this fix
      # targets (gh run 34025245250 and five days either side of it).
      - name: Commit if changed
        id: commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # public/portfolio-app -> heavy/portfolio-app: the asset-offload lane
          # moved every embedded build's assets off Vercel into heavy/ (see
          # src/lib/assetBase.ts), and this line was never updated to match —
          # this job has been committing to a path sync-twin.mjs stopped
          # writing to. heavy/*-app/build-manifest.json is this lane's own
          # new output (gen-app-manifests.mjs); kotlin-field-contract.json is
          # gen-kotlin-data.mjs's, grown here whenever a field is added.
          git add heavy/portfolio-app src/data/repoStats.ts heavy/*-app/build-manifest.json scripts/kotlin-field-contract.json
          if git diff --cached --quiet; then
            echo "The embedded twin is already current."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Same change-only rule as refresh-media.yml: self-healing-spec.md#2.3.
          STAMPS='(generatedAt|verifiedAt|refreshedAt|asOf|lastChecked)'
          DOW="$(date -u +%u)"
          if [ "${{ inputs.fixture }}" = "heartbeat" ]; then DOW=1; fi
          if git diff --cached --quiet -I"$STAMPS" && [ "$DOW" != "1" ]; then
            echo "stamp-only drift; not committing (heartbeat is Monday)"
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --cached --quiet -I"$STAMPS"; then
            echo "heartbeat: committing stamp-only drift (weekly proof of life)"
          fi
          git commit -m "chore: refresh the embedded Compose twin and its figures"
          echo "committed=true" >> "$GITHUB_OUTPUT"

      # continue-on-error on all four below, same as gate_kotlin above: "Gate
      # result" reads each step's .outcome as DATA to decide passed=true/false
      # and route a failure to "Open or update gate-failure issue" instead of
      # pushing — without continue-on-error, a single failing check (e.g. the
      # repoStats.ts self-consistency count, orchestrator-reconciled and
      # expected to disagree on an unmerged lane branch) still failed the
      # job's own conclusion regardless of `if: always()`, so dry_run could
      # never finish green (run 36073585237: Unit tests / Generated artifacts
      # failing here alone).
      - name: Type-check
        id: gate_tsc
        if: always() && steps.commit.outputs.committed == 'true'
        continue-on-error: true
        run: npx tsc -b
      - name: Lint
        id: gate_lint
        if: always() && steps.commit.outputs.committed == 'true'
        continue-on-error: true
        run: npm run lint
      - name: Unit tests
        id: gate_test
        if: always() && steps.commit.outputs.committed == 'true'
        continue-on-error: true
        run: npm run test
      # The same guard CI runs on a push. If a generator and its committed
      # artifact disagree after all of the above, that is a defect worth
      # blocking the push on rather than pushing over.
      - name: Generated artifacts match their generators
        id: gate_check_generated
        if: always() && steps.commit.outputs.committed == 'true'
        continue-on-error: true
        run: npm run check:generated

      # Unconditional (not gated on `committed`): gate_kotlin ran regardless of
      # whether anything else changed this week, and a field-contract
      # regression has to fail this job on its own rather than needing the
      # wasm rebuild to have also produced a diff. When nothing was committed
      # AND gate_kotlin passed, there is nothing to gate — passed=true is
      # "no push blocked", not "everything verified".
      - name: Gate result
        id: gate
        if: always()
        run: |
          if [ "${{ steps.gate_kotlin.outcome }}" != "success" ]; then
            echo "passed=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.commit.outputs.committed }}" != "true" ]; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.gate_tsc.outcome }}" = "success" ] && \
             [ "${{ steps.gate_lint.outcome }}" = "success" ] && \
             [ "${{ steps.gate_test.outcome }}" = "success" ] && \
             [ "${{ steps.gate_check_generated.outcome }}" = "success" ]; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push
        if: steps.commit.outputs.committed == 'true' && steps.gate.outputs.passed == 'true' && inputs.dry_run != 'true'
        run: git push

      - name: 'Dry run: report what would have happened'
        if: always() && inputs.dry_run == 'true'
        run: |
          if [ "${{ steps.gate.outputs.passed }}" != "true" ]; then
            echo "dry run: gate is red (committed=${{ steps.commit.outputs.committed }}), planned: report-gate-failure.sh refresh-twin; nothing would push"
          elif [ "${{ steps.commit.outputs.committed }}" = "true" ]; then
            echo "dry run: committed locally, planned: git push"
          else
            echo "dry run: nothing to commit."
          fi

      # A red gate pushes nothing — the local commit above is discarded with
      # the runner. One issue per workflow (see the script), not one per run.
      # Fires on gate_kotlin's own failure too, even on a run with nothing
      # else to commit — see "Gate result" above. Skipped on a dry run.
      - name: Open or update gate-failure issue
        if: steps.gate.outputs.passed == 'false' && inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/report-gate-failure.sh refresh-twin
