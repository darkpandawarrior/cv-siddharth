name: Refresh project media

# Pulls curated screenshots + demo gifs from the app repos (Doori, PaymentsLab-KMP) and
# regenerates projectStats.ts + galleries.ts from their settings.gradle.kts / Room DB, then
# commits any drift. Runs daily so the portfolio tracks the app repos without a manual poke.
# Local `npm run build` stays hermetic — prebuild (scripts/run-pipeline.mjs) only runs the
# manifest's kind="local" build-stage nodes (6 generators: galleries, compare-sets, feed,
# anthology-feed, system-prompt, images); everything network, private-env or sibling —
# including the now-restamping ones (sitemap, world-plate, ops, system-graph) — runs here,
# in refresh, instead. The freshness-pipelines lane added repo-stats and the six
# Android/KMP sibling checkouts below it needs, so ops's leverage board and
# system-graph's edges are no longer silently skipped on every run here.
on:
  schedule:
    # daily 06:17 UTC; safe again (was weekly-only under the 10 GB deployment
    # cap): a stamp-only day commits nothing (2.3), the rolling bot/data-refresh
    # PR merges at most once a day (2.4A), and vercel-ignore.sh skips any build
    # whose diff touches no build input (M72) — so a quiet day deploys nothing.
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Do everything except open, merge or dispatch; print the classifier verdict.
        type: boolean
        default: false
      fixture:
        description: Force a scenario for testing.
        type: choice
        options: [none, code-change, heartbeat]
        default: none

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

concurrency:
  group: refresh-media
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gen-history reads this repo's own git log; a shallow clone parses one commit
          # and the generator refuses to write a near-empty history (run 34191682522).
          fetch-depth: 0
      # check:generated refuses to run without the Compose twin beside this
      # checkout (arch-L12), which is why run 34195731263 failed its gate after
      # every generator had succeeded. Same checkout ci.yml and refresh-twin use.
      - uses: actions/checkout@v4
        with:
          repository: darkpandawarrior/cv-siddharth-kmp
          path: cv-siddharth-kmp-checkout
      - name: Put the twin where the scripts expect it
        run: mv cv-siddharth-kmp-checkout ../cv-siddharth-kmp
      # gen-system-graph.mjs's E3 edge scans this repo's scripts/*.mjs for
      # `cv-siddharth/main/src/data/(\w+)\.ts` references (trove T1), the same
      # sibling layout the maintainer's own laptop checkout uses, so CI
      # measures what the laptop measures (moved here from P1-wire).
      - uses: actions/checkout@v4
        with:
          repository: darkpandawarrior/darkpandawarrior
          path: darkpandawarrior-checkout
      - name: Put the profile README repo where the scripts expect it
        run: mkdir -p ../../Profile && mv darkpandawarrior-checkout ../../Profile/darkpandawarrior
      # gen-ops.mjs (leverage + vendored drift), gen-system-graph.mjs and
      # gen-repo-stats.mjs's Android/KMP path all resolve siblings at
      # ../../Android/<Repo> and ../../KMP/<repo> — the exact layout the
      # maintainer's own laptop checkouts already use (verified with `gh repo
      # view` below; the LOCAL directory names below are the pre-rename ones
      # on purpose, matching what gen-ops.mjs's CONSUMERS array and
      # gen-app-manifests.mjs's SIBLING map still resolve — a filesystem path,
      # not readable text, so it is outside check-old-names.mjs's scope).
      # Without this, every sibling-kind node above gracefully skipped and
      # kept its committed rows forever — the exact "stale ops.ts" failure
      # this step fixes; Candidai is deliberately absent, it is private and
      # this workflow has no token that can read it.
      - uses: actions/checkout@v4
        with:
          repository: darkpandawarrior/Doori
          path: android-doori-checkout
      - uses: actions/checkout@v4
        with:
          repository: darkpandawarrior/Gaddi
          path: android-gaddi-checkout
      - uses: actions/checkout@v4
        with:
          repository: darkpandawarrior/PaymentsLab-KMP
          path: android-paymentslab-checkout
      - uses: actions/checkout@v4
        with:
          repository: darkpandawarrior/kmp-toolkit
          path: kmp-toolkit-checkout
      - uses: actions/checkout@v4
        with:
          repository: darkpandawarrior/kmp-build-logic
          path: kmp-build-logic-checkout
      - uses: actions/checkout@v4
        with:
          repository: darkpandawarrior/kmp-app-template
          path: kmp-app-template-checkout
      - name: Put the Android + KMP siblings where the scripts expect them
        run: |
          mkdir -p ../../Android ../../KMP
          mv android-doori-checkout ../../Android/Mileway
          mv android-gaddi-checkout ../../Android/Kursi
          mv android-paymentslab-checkout ../../Android/PaymentsLab
          mv kmp-toolkit-checkout ../../KMP/kmp-toolkit
          mv kmp-build-logic-checkout ../../KMP/kmp-build-logic
          mv kmp-app-template-checkout ../../KMP/kmp-app-template
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      # rebuild-showcase re-stitches the narrated films whenever synced frames
      # change (ffmpeg + PIL captions; voiceover comes from the committed
      # content-addressed cache — a narration TEXT change must be re-recorded
      # locally on macOS via `npm run showcase`, and this job fails loudly then).
      # ffmpeg is installed explicitly rather than assumed present on the runner
      # image — that assumption silently broke this job for two days straight
      # (2026-07-27/28, ffprobe missing) once the image stopped bundling it.
      - run: sudo apt-get update -y && sudo apt-get install -y ffmpeg
      - run: pip install --quiet pillow
      # `npm run refresh` includes gen:chess, whose lichess half is a ~9-minute
      # NDJSON export of 14k games. gen-chess-stats.mjs already skips that export
      # when .chess-cache/lichess-games.json carries the same `seenAt` the
      # /api/user endpoint reports, so the cache key here is that same seenAt —
      # keyed on anything else, the runner would restore a cache the generator
      # then rejects and re-pull the export anyway. The User-Agent is mandatory
      # on every outbound request in this feature; lichess tolerates its absence
      # but chess.com 403s, so it is used uniformly rather than per-host.
      # `|| true` on the curl: a lichess blip must not fail the whole refresh —
      # an empty key just means a restore-keys partial hit and a re-export.
      - name: Lichess cache key
        id: chess-key
        run: |
          SEEN=$(curl -sf -H 'User-Agent: cv-siddharth-portfolio/1.0 (siddharthpandalai990@gmail.com)' \
            https://lichess.org/api/user/darkpandawarrior | jq -r '.seenAt // empty') || true
          echo "seen=${SEEN}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: .chess-cache
          # Exact hit => actions/cache skips the post-run save, which is right:
          # nothing in the cache changed. A restore-keys hit does save under the
          # new key, which is also right — the export was re-pulled.
          key: chess-cache-${{ steps.chess-key.outputs.seen }}
          restore-keys: chess-cache-
      # Live Play probes expire after 30 days in store-cache.mjs. Carry the
      # ignored cache between weekly runs; a fresh runner still probes safely.
      - uses: actions/cache@v4
        with:
          path: .store-cache.json
          key: store-cache-${{ github.run_id }}
          restore-keys: store-cache-
      # The full Store generator needs private source checkouts. This narrow
      # mode refreshes only the already published live listings and fails on
      # unknown responses or 404, leaving attribution/history untouched.
      - name: Refresh published Play listings
        id: store_refresh
        if: always()
        run: node scripts/gen-store.mjs --published-only
      # always(): the same "one dead generator must not discard the work of
      # the other 26" reasoning the commit/gate steps below already carry
      # (run 34191682522 class of bug) applies to this step's OWN dependency
      # on store_refresh — a single delisted Play listing (live external
      # data) must not block every other generator, classify-diff and the PR
      # flow from ever running. store_refresh's own outcome still gates
      # Gate result below, so a dead listing still leaves the PR needs-human.
      - name: Sync media + regenerate stats & galleries
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # lifts the raw/API rate limit; repos are public
        run: npm run refresh
      # H2 fixture: forces a diff outside every declared generator output, so
      # classify-diff.mjs below has something real to reject even on a day
      # with no genuine drift. Never touches a declared output, so it never
      # masks a real classifier bug.
      - name: 'Fixture: code-change (force a non-generator diff)'
        if: always() && inputs.fixture == 'code-change'
        run: |
          mkdir -p src/world/v2
          echo "// classify-diff dry-run fixture $(date -u +%FT%TZ)" >> src/world/v2/Water.tsx
      # always(): one dead generator must not discard the work of the other 26.
      # gen-candidai-stats exits 1 on a dead PATTERN by design, and because
      # this step was gated on success, eight days of otherwise-good refreshes
      # were thrown away rather than committed. The run still goes red below.
      #
      # This step only stages + commits LOCALLY. That costs nothing even on a
      # run that will end up pushing nothing, and it lets the four gate steps
      # below check exactly what would be pushed. The push itself is a
      # separate, later step gated on all four passing.
      - name: Commit if changed
        id: commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # `npm run refresh` (above) also runs gen:candidai (src/data/profile.ts),
          # gen:loopdown (src/data/writing.ts), gen:og (public/p/**, public/og-image.png),
          # gen:feed (public/feed.xml), gen:sitemap (public/sitemap.xml),
          # gen:chess (src/data/chess.ts, public/chess/corpus.json), and
          # gen:system-prompt (api/_lib/system-prompt.ts, api/_lib/jd-prompt.ts) — all
          # of that output was silently discarded every run until this line covered it
          # (2026-07-29 audit: only public/projects + galleries/projectStats were staged).
          # `src/world` added this lane: gen:world-plate (corridorPlate.ts) moved from
          # build to refresh-only and its output lives outside src/data.
          git add public src/data src/labs/FanoutLab.tsx src/world api/_lib/system-prompt.ts api/_lib/jd-prompt.ts
          if git diff --cached --quiet; then
            echo "Portfolio media already current."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Stamp-only diffs are not a change, except on the weekly heartbeat
          # (real Monday, or a forced fixture=heartbeat dispatch for testing):
          # self-healing-spec.md#2.3. Every SLA is >=21 days, so six silent
          # days between heartbeats still proves each file alive weekly.
          STAMPS='(generatedAt|verifiedAt|refreshedAt|asOf|lastChecked)'
          DOW="$(date -u +%u)"
          if [ "${{ inputs.fixture }}" = "heartbeat" ]; then DOW=1; fi
          if git diff --cached --quiet -I"$STAMPS" && [ "$DOW" != "1" ]; then
            echo "stamp-only drift; not committing (heartbeat is Monday)"
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --cached --quiet -I"$STAMPS"; then
            echo "heartbeat: committing stamp-only drift (weekly proof of life)"
          fi
          git commit -m "chore: refresh project media + stats from app repos"
          echo "committed=true" >> "$GITHUB_OUTPUT"
          {
            echo 'diffstat<<DIFFSTAT_EOF'
            git diff --stat HEAD~1 HEAD
            echo DIFFSTAT_EOF
          } >> "$GITHUB_OUTPUT"

      # The same gate ci.yml runs on a PR, run here on the local commit above —
      # nothing with no human watching a scheduled run should reach main on
      # the strength of `npm run refresh` alone. Skipped entirely when there is
      # nothing to push (committed=false): checking a no-op is a wasted job.
      - name: Type-check
        id: gate_tsc
        if: always() && steps.commit.outputs.committed == 'true'
        run: npx tsc -b
      - name: Lint
        id: gate_lint
        if: always() && steps.commit.outputs.committed == 'true'
        run: npm run lint
      - name: Unit tests
        id: gate_test
        if: always() && steps.commit.outputs.committed == 'true'
        run: npm run test
      # check:generated is what actually caught the CvChessData.kt-class drift
      # this fix targets; it belongs in the same gate as the other three, not
      # bypassed by an `if: always()` commit step sitting right next to it.
      # A content refresh moves the corpora gen-kotlin-data reads, so the twin
      # drifts by construction on every run that changes anything. That drift
      # is landed by the doctor (doctor.yml, SH-4), which heals twin drift
      # daily now instead of refresh-twin triggering off this workflow, so
      # twin-only drift is reported and handed off there (CHECK_GENERATED_TWIN_DRIFT:
      # handoff below) rather than failing this gate; site-side drift still fails it.
      - name: Generated artifacts match their generators
        id: gate_check_generated
        if: always() && steps.commit.outputs.committed == 'true'
        env:
          CHECK_GENERATED_TWIN_DRIFT: handoff
        run: npm run check:generated

      # The data-loss tripwire behind every generator's own refusal to write
      # bad data (self-healing-spec.md#3, point 4): nothing merges unattended
      # unless every changed path is a declared generator output and no
      # output collapsed. Diffed against origin/main, so a scheduled run on
      # main sees exactly the one local commit above; a lane-branch dispatch
      # (dry_run) also sees the lane's own diff, which is fine — dry_run
      # never opens or merges anything on it either way.
      - name: Classify the diff
        id: classify
        if: always() && steps.commit.outputs.committed == 'true'
        run: |
          set +e
          node scripts/classify-diff.mjs origin/main
          CLASSIFY_EXIT=$?
          set -e
          echo "classify-diff: exit ${CLASSIFY_EXIT}"
          if [ "$CLASSIFY_EXIT" -eq 0 ]; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Gate result
        id: gate
        if: always() && steps.commit.outputs.committed == 'true'
        run: |
          if [ "${{ steps.store_refresh.outcome }}" = "success" ] && \
             [ "${{ steps.gate_tsc.outcome }}" = "success" ] && \
             [ "${{ steps.gate_lint.outcome }}" = "success" ] && \
             [ "${{ steps.gate_test.outcome }}" = "success" ] && \
             [ "${{ steps.gate_check_generated.outcome }}" = "success" ] && \
             [ "${{ steps.classify.outputs.passed }}" = "true" ]; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
          fi

      # H2 (self-healing-spec.md#3): replaces the old direct `git push`. The
      # commit above already exists on this checkout; un-commit it back to a
      # staged diff so create-pull-request can adopt it onto its own branch
      # rather than pushing this checkout's own ref.
      - name: Restage the local commit for the PR
        if: steps.commit.outputs.committed == 'true' && inputs.dry_run != 'true'
        run: git reset --soft HEAD~1

      - name: Open or update the rolling data PR
        id: cpr
        if: steps.commit.outputs.committed == 'true' && inputs.dry_run != 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: bot/data-refresh
          delete-branch: false
          commit-message: "chore: refresh project media + stats from app repos"
          title: "chore: rolling data refresh"
          labels: data-refresh
          body: |
            Automated daily refresh (self-healing-spec.md#2 and #3).

            Generators run: `npm run refresh` (see the run log for the full
            per-generator list). Refresh published Play listings (`gen-store
            --published-only`): ${{ steps.store_refresh.outcome }}.

            Classifier verdict: classify-diff exit ${{ steps.classify.outcome == 'success' && (steps.classify.outputs.passed == 'true' && '0' || '1 (non-generator or collapsed output)') || 'n/a' }}

            Diff stat:
            ```
            ${{ steps.commit.outputs.diffstat }}
            ```

      # Merges only what a registered generator wrote, that passed the same
      # four checks as a human PR, and did not collapse. Code never merges
      # unattended: code is by definition not a declared generator output, so
      # classify-diff (folded into `gate` above) would have already failed it.
      - name: Merge on green
        if: steps.commit.outputs.committed == 'true' && steps.gate.outputs.passed == 'true' && inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge "${{ steps.cpr.outputs.pull-request-number }}" --squash --delete-branch
          # A GITHUB_TOKEN push triggers no workflow; a dispatch does (M66).
          gh workflow run publish-assets.yml --ref main
          gh workflow run ci.yml --ref main

      # Nothing refreshed is lost: the PR above already holds the full
      # refreshed data. Leave it open, labelled for a human, instead of
      # discarding the local commit with the runner the way the old Push
      # step did.
      - name: Label needs-human
        if: steps.commit.outputs.committed == 'true' && steps.gate.outputs.passed == 'false' && inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr edit "${{ steps.cpr.outputs.pull-request-number }}" --add-label needs-human

      - name: 'Dry run: report what would have happened'
        if: inputs.dry_run == 'true'
        run: |
          if [ "${{ steps.commit.outputs.committed }}" != "true" ]; then
            echo "dry run: nothing to commit."
            exit 0
          fi
          echo "dry run: committed locally, opened/merged/dispatched nothing."
          if [ "${{ steps.gate.outputs.passed }}" = "true" ]; then
            echo "planned: gh pr merge --squash --delete-branch (bot/data-refresh), then re-dispatch publish-assets.yml + ci.yml"
          else
            echo "planned: label needs-human; planned: report-gate-failure.sh refresh-media"
          fi

      # A red gate leaves the PR open with needs-human instead of pushing —
      # the failure itself still needs a human alert. One issue per check
      # (see the script), not one per run. Skipped on a dry run: "does
      # everything except open, merge or dispatch" covers filing an issue too.
      - name: Open or update gate-failure issue
        if: (steps.store_refresh.outcome == 'failure' || (steps.commit.outputs.committed == 'true' && steps.gate.outputs.passed == 'false')) && inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/report-gate-failure.sh refresh-media
